<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Cyber Slate -->
    <radialGradient id="bgGrad2" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Outer Angular Shield Bezel Gradient: Cyber Emerald & Cyan Platinum -->
    <linearGradient id="shieldApexBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="30%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Faceted Shield Left Plate (Matte Obsidian Shadow) -->
    <linearGradient id="plateLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Faceted Shield Right Plate (Gloss Reflection) -->
    <linearGradient id="plateRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Supersonic Logistics Wing / Speed Chevrons (Neon Emerald to Solar Gold) -->
    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="wingGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonEmeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="deepDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dark Premium App Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Background Tech Grid / Hex Ring -->
  <polygon points="256,22 466,136 466,376 256,490 46,376 46,136" 
           fill="none" 
           stroke="#06b6d4" 
           stroke-width="1.5" 
           stroke-dasharray="8,8" 
           opacity="0.2"/>

  <!-- Main Vanguard Shield (Angular Cyber-Facet Shield) -->
  <g filter="url(#deepDropShadow)" transform="translate(0, -6)">
    
    <!-- Outer Cyber Bezel (Geometric 8-point Faceted Shield Frame) -->
    <path d="M 256 56 
             L 396 100 
             L 420 220 
             L 374 330 
             L 256 408 
             L 138 330 
             L 92 220 
             L 116 100 Z" 
          fill="url(#shieldApexBezel)" 
          filter="url(#neonEmeraldGlow)"/>

    <!-- Inner Shield Recess Border (Cyber Dark Gap) -->
    <path d="M 256 68 
             L 384 108 
             L 406 216 
             L 364 318 
             L 256 392 
             L 148 318 
             L 106 216 
             L 128 108 Z" 
          fill="#020617"/>

    <!-- Inner Shield Left Facet (Deep Matte Carbon Plate) -->
    <path d="M 256 74 
             L 256 384 
             L 154 314 
             L 114 214 
             L 134 112 Z" 
          fill="url(#plateLeft)" 
          stroke="#10b981" 
          stroke-width="1" 
          stroke-opacity="0.3"/>

    <!-- Inner Shield Right Facet (Lighter Metallic Carbon Plate) -->
    <path d="M 256 74 
             L 378 112 
             L 398 214 
             L 358 314 
             L 256 384 Z" 
          fill="url(#plateRight)" 
          stroke="#38bdf8" 
          stroke-width="1" 
          stroke-opacity="0.4"/>

    <!-- Center Vertical Ridge Spine of Shield -->
    <line x1="256" y1="74" x2="256" y2="384" stroke="#67e8f9" stroke-width="2.5" opacity="0.6"/>

    <!-- Left Angular Light Glare -->
    <polygon points="134,112 256,74 210,180 114,214" fill="#ffffff" opacity="0.07"/>

    <!-- Shield Geometric Micro Accent Nodes -->
    <circle cx="134" cy="112" r="4.5" fill="#34d399"/>
    <circle cx="378" cy="112" r="4.5" fill="#38bdf8"/>
    <circle cx="256" cy="74" r="5" fill="#67e8f9"/>
    <circle cx="256" cy="384" r="5" fill="#10b981"/>

    <!-- ==================== CENTRAL MOTIF: SUPERSONIC LOGISTICS CHEVRONS / APEX FALCON ==================== -->
    <!-- Upper Chevron / Falcon Wing Tip (Speed & Global Reach) -->
    <path d="M 256 118 
             L 348 182 
             L 326 204 
             L 256 156 
             L 186 204 
             L 164 182 Z" 
          fill="url(#wingGrad3)" 
          filter="url(#neonEmeraldGlow)"/>

    <!-- Middle Main Chevron / Dynamic Logistic Power Arrow (Vibrant Emerald Mint) -->
    <path d="M 256 168 
             L 352 238 
             L 328 262 
             L 256 212 
             L 184 262 
             L 160 238 Z" 
          fill="url(#wingGrad1)" 
          filter="url(#neonEmeraldGlow)"/>

    <!-- Lower Apex Chevron / Golden Delivery & Security Crest (Solar Gold) -->
    <path d="M 256 226 
             L 334 286 
             L 310 308 
             L 256 268 
             L 202 308 
             L 178 286 Z" 
          fill="url(#wingGrad2)"/>

    <!-- Glowing Core Diamond Node at Apex Center -->
    <g transform="translate(256, 172)">
      <polygon points="0,-16 14,0 0,16 -14,0" fill="#ffffff" filter="url(#neonEmeraldGlow)"/>
      <polygon points="0,-9 8,0 0,9 -8,0" fill="#06b6d4"/>
    </g>

    <!-- Speed Lines / Circuit Connectors -->
    <line x1="184" y1="262" x2="140" y2="295" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="328" y1="262" x2="372" y2="295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  </g>

  <!-- Typography at the Bottom: Crisp, Tech, Modern -->
  <text x="256" y="444" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="33" 
        font-weight="900" 
        letter-spacing="4">
    LOGISTIKAPPS
  </text>
  
  <text x="256" y="474" 
        text-anchor="middle" 
        fill="#10b981" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="13" 
        font-weight="800" 
        letter-spacing="6">
    VANGUARD SHIELD
  </text>
</svg>
